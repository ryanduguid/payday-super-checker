<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1120" height="480" rx="20" fill="#1c2541" fill-opacity="0.6" stroke="#3a506b" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Pill -->
  <rect x="120" y="125" width="280" height="36" rx="18" fill="#00b4d8" fill-opacity="0.15" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="260" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#90e0ef" text-anchor="middle" letter-spacing="1">AUSTRALIAN PAYDAY SUPER</text>

  <!-- Main Title -->
  <text x="120" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#cyanGrad)">payday-super-checker</text>

  <!-- Subtitle -->
  <text x="120" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Evaluate 7-business-day statutory contribution deadlines and estimate SG charge exposure.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(120, 325)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#0b132b" stroke="#48cae4" stroke-width="1.2"/>
    <text x="105" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">7-Day Payday Horizon</text>

    <!-- Pill 2 -->
    <rect x="225" y="0" width="220" height="42" rx="10" fill="#0b132b" stroke="#48cae4" stroke-width="1.2"/>
    <text x="335" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Official Holiday Calendars</text>

    <!-- Pill 3 -->
    <rect x="460" y="0" width="220" height="42" rx="10" fill="#0b132b" stroke="#48cae4" stroke-width="1.2"/>
    <text x="570" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Experimental SG Charge</text>

    <!-- Pill 4 -->
    <rect x="695" y="0" width="180" height="42" rx="10" fill="#0b132b" stroke="#48cae4" stroke-width="1.2"/>
    <text x="785" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Zero Dependencies</text>
  </g>

  <!-- Terminal Snippet Box -->
  <g transform="translate(120, 395)">
    <rect x="0" y="0" width="875" height="125" rx="12" fill="#070d1e" stroke="#1f2d4d" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="20" y="55" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#38bdf8">$ payday-super-check payrun.csv --as-at 2026-09-10</text>
    <text x="20" y="80" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#94a3b8">ON_TIME: 5  AT_RISK: 1  LATE: 2  UNPAID: 1  |  Exposure: $788.76 - $1262.02</text>
    <text x="20" y="105" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#22c55e">✓ Verdict proven against verified ATO statutory calendar rules</text>
  </g>
</svg>
