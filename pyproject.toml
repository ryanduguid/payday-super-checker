[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payday-super-checker"
version = "0.1.0"
description = "Check Australian super contributions against payday-super deadlines and produce experimental SG charge estimates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "superannuation", "payday-super", "compliance", "accounting", "ato"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = ["build==1.5.0", "pytest>=8", "holidays==0.102"]

[project.scripts]
payday-super-check = "paydaysuper.cli:main"

[tool.setuptools]
packages = ["paydaysuper"]
include-package-data = false

[tool.setuptools.package-data]
paydaysuper = ["data/*.json", "data/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
