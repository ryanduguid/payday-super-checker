[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payday-super-checker"
version = "0.1.2"
description = "Experimental review aid for Australian payday-super deadlines and SG charge estimates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "superannuation", "payday-super", "accounting", "ato"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
[project.urls]
Homepage = "https://duguid.com.au/tools/payday-super/"
Repository = "https://github.com/ryanduguid/payday-super-checker.git"
Issues = "https://github.com/ryanduguid/payday-super-checker/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.14",
    "build==1.5.0",
    "pytest>=8",
    "hypothesis==6.165.10",
    "holidays==0.103",
    "setuptools==84.0.0",
    "coverage==7.15.4",
    "diff-cover==10.5.1",
]

[project.scripts]
payday-super-check = "paydaysuper.cli:main"

[tool.setuptools]
packages = ["paydaysuper"]
include-package-data = false

[tool.setuptools.package-data]
paydaysuper = ["data/*.json", "data/profiles/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["paydaysuper", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["paydaysuper"]
ignore_missing_imports = true
pretty = true
