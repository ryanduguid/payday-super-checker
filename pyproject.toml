[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payday-super-checker"
version = "0.1.0"
description = "Check Australian super contributions against the payday-super deadlines and estimate SG charge exposure"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Duguid" }]
keywords = ["australia", "superannuation", "payday-super", "compliance", "accounting", "ato"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "holidays==0.101"]

[project.scripts]
payday-super-check = "paydaysuper.cli:main"

[tool.setuptools]
packages = ["paydaysuper"]

[tool.setuptools.package-data]
paydaysuper = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
