name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked environment manager
        run: python -m pip install "uv==0.12.0"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Lint
        run: uv run --locked --extra dev --python 3.12 ruff check paydaysuper tests

      - name: Typecheck
        run: uv run --locked --extra dev --python 3.12 mypy paydaysuper

      - name: Audit
        run: uv run --locked --extra dev --python 3.12 --with "pip-audit==2.10.1" pip-audit --local --strict

      - name: Run tests
        run: uv run --locked --extra dev --python 3.12 pytest
