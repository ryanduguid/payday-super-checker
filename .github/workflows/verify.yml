name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked environment manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Lint
        run: uv run --locked --extra dev --python 3.12 ruff check paydaysuper tests

      - name: Typecheck
        run: uv run --locked --extra dev --python 3.12 mypy paydaysuper

      - name: Audit
        run: uv run --locked --extra dev --python 3.12 --with "pip-audit==2.10.1" pip-audit --local --strict

      - name: Run tests with scoped branch coverage
        run: >-
          uv run --locked --extra dev --python 3.12 coverage run --branch
          --source=paydaysuper.assess,paydaysuper.report -m pytest

      - name: Require complete changed-line coverage in assessment logic
        run: |
          uv run --locked --extra dev --python 3.12 coverage xml --include="paydaysuper/assess.py,paydaysuper/report.py" -o coverage.xml
          uv run --locked --extra dev --python 3.12 diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100
