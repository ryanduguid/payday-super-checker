name: Publish to PyPI

# The `release: published` trigger below never actually fires: releases in
# this repository are created by release.yml using the workflow's own
# GITHUB_TOKEN, and events raised by GITHUB_TOKEN do not trigger other
# workflows (a documented GitHub Actions limitation, not a bug in
# release.yml). It is kept here as a statement of intent in case that
# limitation is ever worked around (e.g. a PAT or GitHub App token). The
# workflow_dispatch trigger is the path that actually runs today: after
# release.yml publishes a release, dispatch this workflow with that same
# tag. It gates nothing else: if it fails (for example before the PyPI
# trusted publisher is registered), the GitHub release itself is unaffected.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag to publish (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    name: publish the exact release assets to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read # Download the published release assets.
      id-token: write # Mint the OIDC token for PyPI trusted publishing.
    steps:
      - name: Download the wheel and sdist from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && sha256sum --check SHA256SUMS)
          mv assets/*.whl assets/*.tar.gz dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
