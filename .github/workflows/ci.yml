name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"   # the declared floor
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"   # where path handling can diverge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - run: uv run --locked --extra dev --python ${{ matrix.python }} pytest -q

  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict

  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - run: uv run --locked --extra dev --python 3.12 python -m build
      # The law files ship as package data; a wheel that cannot find them
      # produces a CLI that will not start.
      - name: install the wheel and run it
        run: |
          python -m venv /tmp/venv
          # --no-index, or pip is free to resolve the name from PyPI and
          # test a release nobody built in this job.
          /tmp/venv/bin/pip install --no-index --find-links dist payday-super-checker
          /tmp/venv/bin/payday-super-check examples/sample_payrun.csv \
            -o /tmp/report.csv --as-at 2026-08-10 || [ $? -eq 2 ]
          # The import path reads data/profiles/*.json, package data the
          # check path never touches, so a wheel that ships the law files
          # and drops the profiles passes every step above and still cannot
          # import a payroll export. Run both commands of the documented
          # two-command flow, the second against the first's output.
          /tmp/venv/bin/payday-super-check import \
            --payroll tests/fixtures/importers/myob_payroll.csv \
            --super tests/fixtures/importers/myob_super.csv \
            -o /tmp/contributions.csv || [ $? -eq 2 ]
          /tmp/venv/bin/payday-super-check /tmp/contributions.csv \
            -o /tmp/report_from_import.csv --as-at 2026-08-10 || [ $? -eq 2 ]
      - name: the shipped tests must pass from the sdist
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && pip install -e ".[dev]" && pytest -q
